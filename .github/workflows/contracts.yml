name: CPU contract tests
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy scipy scikit-learn pillow pyyaml matplotlib
      - run: python -m unittest discover -s tests -v
      - run: python -m tools.report_results
